services:
  - type: web
    name: vegme-public-demo
    runtime: static
    buildCommand: npm --prefix client ci && npm --prefix client run build
    staticPublishPath: ./client/build
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NODE_VERSION
        value: "24.14.0"
      - key: REACT_APP_PUBLIC_DEMO
        value: "true"
